# Copy into config/packages/messenger.yaml in your Symfony application.
# Replace the endpoint and message class with your application's values.
# Choose visibility for your handler duration; this example does not renew leases.
sqlite_queue:
    visibility_timeout: 60000
framework:
    messenger:
        transports:
            async:
                dsn: 'sqlite-queue://jobs'
                options:
                    endpoint: '/tmp/sqlite-queue-demo/queue.sock'
                    timeout: 10
                serializer: messenger.transport.native_php_serializer
        routing:
            'App\Message\ExampleMessage': async
