# Copy into config/packages/messenger.yaml.
# Replace the message classes and endpoint with your application's values.
# These settings apply to bin/console sqlite-queue:broker, not the standalone command.
# Run consumers with --keepalive=5 for handlers or batch flushes that may exceed 60s.
sqlite_queue:
    redeliver_timeout: 60
    synchronous: normal
    # Optional. Defaults preserve the published 1,040,000-byte / 64-connection budgets.
    # max_payload: 1040000
    # max_connections: 64

framework:
    messenger:
        transports:
            email:
                dsn: 'sqlite-queue://emails'
                options:
                    endpoint: '/tmp/sqlite-queue-demo/queue.sock'
                    timeout: 10
                serializer: messenger.transport.native_php_serializer
            reports:
                dsn: 'sqlite-queue://reports'
                options:
                    endpoint: '/tmp/sqlite-queue-demo/queue.sock'
                    timeout: 10
                serializer: messenger.transport.native_php_serializer
        routing:
            'App\Message\SendWelcomeEmail': email
            'App\Message\GenerateMonthlyReport': reports
